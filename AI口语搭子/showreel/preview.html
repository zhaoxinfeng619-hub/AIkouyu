<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI口语搭子 · 产品展示</title><style>*{box-sizing:border-box}body{margin:0;background:#111317;color:#f8f9fb;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:1280px;margin:0 auto;padding:36px 32px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}h1{font-size:22px;font-weight:600;margin:0}span{color:#7e8796;font-size:13px}video{width:100%;display:block;border-radius:18px;background:#f3f4f5;aspect-ratio:16/9}footer{margin-top:24px;display:flex;align-items:center;gap:14px}button,a{font:inherit;color:inherit;text-decoration:none;border:0;background:#22262d;padding:12px 20px;border-radius:12px;cursor:pointer}button:first-child{background:#1765ee}p{font-size:13px;color:#788292;line-height:1.8}#elapsed{font-variant-numeric:tabular-nums;margin-left:auto}</style><main><header><h1>AI口语搭子</h1><span>Product Showreel · 30 秒</span></header><video id="film" controls playsinline preload="auto" src="video.mp4" poster="evidence/F843.png"></video><footer><button id="play">播放</button><button id="replay">重播</button><a href="video.mp4" download>下载成片</a><span id="elapsed">00:00 / 00:30</span></footer><p>选择场景 → 认识角色 → 开口对话 → 自然插话 → 语音球 → 复制记录。片中对话为脚本演示。</p></main><script>const v=document.getElementById('film');document.getElementById('play').onclick=()=>v.paused?v.play():v.pause();document.getElementById('replay').onclick=()=>{v.currentTime=0;v.play()};v.ontimeupdate=()=>{document.getElementById('elapsed').textContent='00:'+Math.floor(v.currentTime).toString().padStart(2,'0')+' / 00:30';document.getElementById('play').textContent=v.paused?'播放':'暂停'};</script></html>
